name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: 校验发布 tag 与工作区版本
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$ ]]
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          python3 - "$RELEASE_TAG" <<'PY'
          from pathlib import Path
          import sys, tomllib
          tag = sys.argv[1].removeprefix("v")
          base_tag = tag.split("+", 1)[0].split("-", 1)[0]
          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          if tag != version and base_tag != version:
              raise SystemExit(f"release tag {tag} does not match workspace version {version}")
          PY

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Ubuntu 依赖
        if: runner.os == 'Linux'
        run: |
          if ! command -v pkg-config >/dev/null 2>&1; then
            sudo rm -f /etc/apt/sources.list.d/microsoft*.list* /etc/apt/sources.list.d/microsoft*.sources*
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config
          fi

      - name: 构建 dfy 与 dfy-relay
        shell: bash
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" \
            -p dfy-cli -p dfy-relay

      - name: 构建 Windows dfy-manager
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" -p dfy-manager
          mkdir -p dist-manager
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/dfy-manager.exe" dist-manager/

      - name: 上传 Windows dfy-manager
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-windows-manager
          path: dist-manager/dfy-manager.exe
          if-no-files-found: error

      - name: 构建 macOS/Linux dfy-manager
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" -p dfy-manager
          mkdir -p dist-manager
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/dfy-manager" "dist-manager/dfy-manager-${{ matrix.target }}"

      - name: 上传 macOS/Linux dfy-manager
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-manager-${{ matrix.target }}
          path: dist-manager/dfy-manager-${{ matrix.target }}
          if-no-files-found: error

      - name: 创建架构正确的归档与校验和
        shell: bash
        run: |
          python3 packaging/make_archive.py \
            --binary-dir "$CARGO_TARGET_DIR/${{ matrix.target }}/release" \
            --target "${{ matrix.target }}" \
            --version "$RELEASE_TAG" \
            --output-dir dist

      - name: 生成 CycloneDX SBOM 与第三方许可声明
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          python3 packaging/generate_sbom.py --check \
            --output-sbom "dist/dafeiyu-${RELEASE_TAG#v}-sbom.cdx.json" \
            --output-notices "dist/THIRD-PARTY-NOTICES.txt"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows-installer:
    name: Windows Inno Setup installer
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: dafeiyu-x86_64-pc-windows-msvc
          path: archive
      - name: 解压 Windows 二进制
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive = next(Path("archive").glob("*.zip"))
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall("binaries")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: dafeiyu-windows-manager
          path: binaries
      - name: 确保 Inno Setup 可用
        shell: bash
        run: |
          if ! command -v ISCC.exe >/dev/null 2>&1 && ! command -v iscc >/dev/null 2>&1; then
            choco install innosetup --no-progress -y
          fi
      - name: 构建安装包
        shell: bash
        env:
          ISCC: '/c/Program Files (x86)/Inno Setup 6/ISCC.exe'
        run: |
          bash packaging/windows/build-installer.sh \
            --binary-dir binaries \
            --version "$RELEASE_TAG" \
            --output-dir dist
      - name: 校验 Windows 安装、覆盖升级与卸载清理
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "$env:RELEASE_TAG".TrimStart("v")
          $setup = (Get-Item "dist/dafeiyu-$ver-windows-x86_64-setup.exe").FullName
          $app = "C:\dfy-install-test"
          $reg = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{9DB56B13-75D0-4D95-A0E7-DF9E6294B984}_is1"
          $p1 = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$app" -Wait -PassThru
          if ($p1.ExitCode -ne 0) { throw "Initial install failed: $($p1.ExitCode)" }
          & "$app\dfy.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "dfy.exe --version failed" }
          & "$app\dfy-relay.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "dfy-relay.exe --version failed" }
          & "$app\dfy-manager.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "dfy-manager.exe --help failed" }
          if (-not (Test-Path "$app\dfy.ico")) { throw "missing dfy.ico" }
          $lic = Get-Content "$app\docs\LICENSE" -Raw
          if ($lic -notmatch "PolyForm Noncommercial License 1.0.0") { throw "LICENSE mismatch" }
          $props = Get-ItemProperty $reg
          if ($props.DisplayVersion -ne $ver) { throw "DisplayVersion mismatch: $($props.DisplayVersion)" }
          $p2 = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$app" -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "In-place upgrade install failed: $($p2.ExitCode)" }
          $p3 = Start-Process -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p3.ExitCode -ne 0) { throw "Uninstall failed: $($p3.ExitCode)" }
          Start-Sleep -Seconds 3
          foreach ($f in @("dfy.exe","dfy-relay.exe","dfy-manager.exe")) {
            if (Test-Path "$app\$f") { throw "residual binary after uninstall: $f" }
          }
          if (Test-Path $reg) { throw "residual Uninstall registry key" }
          Write-Host "WINDOWS INSTALLER E2E VERIFICATION PASS ($ver)"
      - uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-windows-x86_64-installer
          path: dist/*
          if-no-files-found: error

  linux-packages:
    name: Linux ${{ matrix.arch }} ${{ matrix.format }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            format: deb
          - os: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            format: rpm
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            format: deb
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            format: rpm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: dafeiyu-${{ matrix.target }}
          path: archive
      - name: 安装打包工具
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list* /etc/apt/sources.list.d/microsoft*.sources*
          sudo apt-get update
          if [ "${{ matrix.format }}" = rpm ]; then
            sudo apt-get install -y --no-install-recommends rpm
          else
            sudo apt-get install -y --no-install-recommends dpkg-dev
          fi
      - name: 解压 Linux 二进制与 Manager
        shell: bash
        run: |
          mkdir -p binaries
          tar -xzf archive/dafeiyu-*.tar.gz -C binaries
      - uses: actions/download-artifact@v4
        with:
          name: dafeiyu-manager-${{ matrix.target }}
          path: binaries
      - name: 准备 Linux Manager
        run: mv "binaries/dfy-manager-${{ matrix.target }}" binaries/dfy-manager && chmod 0755 binaries/dfy-manager
      - name: 构建 DEB/RPM（不启用、不启动服务）
        shell: bash
        run: |
          bash packaging/linux/build-packages.sh \
            --binary-dir binaries \
            --version "$RELEASE_TAG" \
            --arch "${{ matrix.arch }}" \
            --format "${{ matrix.format }}" \
            --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-linux-${{ matrix.arch }}-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error

  macos-installers:
    name: macOS ${{ matrix.arch }} PKG/DMG
    needs: build
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: dafeiyu-${{ matrix.target }}
          path: archive
      - name: 解压 macOS 二进制
        run: |
          mkdir -p binaries
          tar -xzf archive/dafeiyu-*.tar.gz -C binaries
      - uses: actions/download-artifact@v4
        with:
          name: dafeiyu-manager-${{ matrix.target }}
          path: binaries
      - name: 准备 macOS GUI 二进制
        run: |
          mv "binaries/dfy-manager-${{ matrix.target }}" binaries/dfy-manager
          chmod 0755 binaries/dfy-manager
      - name: 构建可选签名/公证的 PKG 与 DMG
        shell: bash
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          MAC_DMG_SIGNING_IDENTITY: ${{ secrets.MAC_DMG_SIGNING_IDENTITY }}
          MAC_APP_SIGNING_IDENTITY: ${{ secrets.MAC_APP_SIGNING_IDENTITY }}
          MAC_NOTARY_KEY_BASE64: ${{ secrets.MAC_NOTARY_KEY_BASE64 }}
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_REQUIRE_NOTARIZATION: ${{ secrets.MAC_REQUIRE_NOTARIZATION }}
        run: |
          bash packaging/macos/build-installer.sh \
            --binary-dir binaries \
            --version "$RELEASE_TAG" \
            --arch "${{ matrix.arch }}" \
            --format all \
            --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-macos-${{ matrix.arch }}-installers
          path: dist/*
          if-no-files-found: error

  android:
    name: Android debug and release APK/AAB
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Rust Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: 安装 Android SDK/NDK 与 cargo-ndk
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          SDKMGR="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n' | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMGR" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          cargo install cargo-ndk --locked
      - name: 构建并验证签名 APK/AAB（签名凭据缺失即失败）
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash packaging/android/build.sh \
            --version "${RELEASE_TAG#v}" \
            --signing required \
            --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-android
          path: dist/*
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release
    needs: [build, windows-installer, linux-packages, macos-installers, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 只整理各端安装包
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp artifacts/dafeiyu-${version}-windows-x86_64-setup.exe release-assets/
          cp artifacts/dafeiyu_${version}_*.deb release-assets/
          cp artifacts/dafeiyu-${version}-*.rpm release-assets/
          cp artifacts/dafeiyu-${version}-macos-*.pkg release-assets/
          cp artifacts/dafeiyu-${version}-macos-*.dmg release-assets/
          cp artifacts/dafeiyu-${version}-release.apk release-assets/
          count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          [ "$count" -eq 10 ] || { echo "expected 10 installers, found $count" >&2; exit 1; }

      - name: 生成直链发布说明
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          find_asset() {
            local pattern="$1"
            local -a matches
            mapfile -t matches < <(find artifacts -maxdepth 1 -type f -name "$pattern" -printf '%f\n')
            [ "${#matches[@]}" -eq 1 ] || { echo "expected one asset matching $pattern, found ${#matches[@]}" >&2; return 1; }
            printf '%s\n' "${matches[0]}"
          }
          win="$(find_asset "dafeiyu-${version}-windows-x86_64-setup.exe")"
          linux_amd64_deb="$(find_asset "dafeiyu_${version}_amd64.deb")"
          linux_arm64_deb="$(find_asset "dafeiyu_${version}_arm64.deb")"
          linux_amd64_rpm="$(find_asset "dafeiyu-${version}-*.x86_64.rpm")"
          linux_arm64_rpm="$(find_asset "dafeiyu-${version}-*.aarch64.rpm")"
          mac_x86_pkg="$(find_asset "dafeiyu-${version}-macos-x86_64-*.pkg")"
          mac_x86_dmg="$(find_asset "dafeiyu-${version}-macos-x86_64-*.dmg")"
          mac_arm_pkg="$(find_asset "dafeiyu-${version}-macos-arm64-*.pkg")"
          mac_arm_dmg="$(find_asset "dafeiyu-${version}-macos-arm64-*.dmg")"
          android="$(find_asset "dafeiyu-${version}-release.apk")"
          for asset in "$win" "$linux_amd64_deb" "$linux_arm64_deb" "$linux_amd64_rpm" "$linux_arm64_rpm" \
                       "$mac_x86_pkg" "$mac_x86_dmg" "$mac_arm_pkg" "$mac_arm_dmg" "$android"; do
            [ -n "$asset" ] || { echo "missing expected installer" >&2; exit 1; }
          done
          cat > release-notes.md <<EOF
          ## 下载安装包

          这里只放安装包。源代码、构建脚本和文档都在[仓库](https://github.com/${GITHUB_REPOSITORY}/tree/${RELEASE_TAG})中。

          ### Windows
          - [Windows 10/11 64 位安装程序](${base}/${win})

          ### macOS
          - [Apple 芯片（M1/M2/M3/M4）DMG](${base}/${mac_arm_dmg})
          - [Apple 芯片 PKG 安装包](${base}/${mac_arm_pkg})
          - [Intel 芯片 DMG](${base}/${mac_x86_dmg})
          - [Intel 芯片 PKG 安装包](${base}/${mac_x86_pkg})

          ### Linux
          - [x86_64 / amd64 DEB](${base}/${linux_amd64_deb})
          - [x86_64 / amd64 RPM](${base}/${linux_amd64_rpm})
          - [ARM64 / aarch64 DEB](${base}/${linux_arm64_deb})
          - [ARM64 / aarch64 RPM](${base}/${linux_arm64_rpm})

          ### Android
          - [Android 安装包（APK，已签名）](${base}/${android})

          ## 使用前
          - 被控端安装管理端并开启允许控制；查看端使用同一版本连接。
          - 口令只用于本次连接，不会保存。不要通过不可信渠道发送口令。
          - Windows IDD 虚拟显示驱动、macOS 正式代码签名与 Apple 公证仍未完成；Android 包已完成 CI 签名，但不等同于 Google Play 发布或真机验收。
          - Linux 当前支持 X11，尚不提供完整的 Wayland 桌面支持。
          - 许可证：PolyForm Noncommercial License 1.0.0，仅限非商用。
          EOF

      - name: 判断 SemVer 预发布标记
        id: release_channel
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ "${version%%+*}" == *-* ]]; then
            printf 'prerelease=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'prerelease=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 大肥鱼远程 ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          generate_release_notes: true
          files: release-assets/*
          body_path: release-notes.md
