[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
rust-version = "1.75"
authors = ["Dafeiyu Remote Project"]

[workspace.dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
prost = { version = "0.13", default-features = false, features = ["derive", "std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
blake3 = "1"
hex = "0.4"
jni = "0.21"

dfy-proto = { path = "crates/dfy-proto" }
dfy-transport = { path = "crates/dfy-transport" }
dfy-session = { path = "crates/dfy-session" }

[profile.release]
opt-level = 2