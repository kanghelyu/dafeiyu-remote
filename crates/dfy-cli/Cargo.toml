[package]
name = "dfy-cli"
description = "dfy command line: key generation, QUIC demo agent/client, end-to-end selftest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dfy"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
dfy-proto.workspace = true
dfy-transport.workspace = true
dfy-capture = { path = "../dfy-capture" }
dfy-relay = { path = "../dfy-relay" }
dfy-p2p = { path = "../dfy-p2p" }
dfy-clipboard = { path = "../dfy-clipboard" }
dfy-codec = { path = "../dfy-codec" }
dfy-input = { path = "../dfy-input" }
dfy-session = { path = "../dfy-session" }
ed25519-dalek.workspace = true
hex.workspace = true
quinn.workspace = true
rand.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }