[package]
name = "dfy-relay"
description = "DFYP/1 relay server: paired UDP forwarding, TCP fallback, admin metrics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
hmac.workspace = true
sha2.workspace = true
rand.workspace = true
hex.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["io-util"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# 集成测试用：QUIC over relay 端到端验证（仅测试目标，不进生产依赖）。
[dev-dependencies]
dfy-transport.workspace = true
quinn.workspace = true