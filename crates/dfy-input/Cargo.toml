[package]
name = "dfy-input"
description = "HID usage mapping, Windows SendInput / Linux X11 injection and shortcut decision for Dafeiyu Remote"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
anyhow.workspace = true
tracing.workspace = true
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["xkb", "xtest"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }