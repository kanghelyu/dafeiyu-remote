[package]
name = "dfy-manager"
description = "Desktop manager UI for Dafeiyu Remote relay profiles and virtual displays"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dfy-manager"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dfy-relay = { path = "../dfy-relay" }
dfy-relay-profiles = { path = "../dfy-relay-profiles" }
dfy-transport = { path = "../dfy-transport" }
dfy-vdisplay = { path = "../dfy-vdisplay" }
eframe = { version = "=0.27.2", default-features = true }
png = "0.18"
rand.workspace = true
rfd = { version = "0.15", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
tokio.workspace = true
toml = "0.8"
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize = { version = "1", features = ["alloc"] }
