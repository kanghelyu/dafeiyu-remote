# 大肥鱼远程 —— Windows 剪贴板后端 / 变更监听 / 拉取式格式枚举。
# Windows 实现；macOS/Linux 后续按同一 ClipboardBackend trait 补齐。

[package]
name = "dfy-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Windows clipboard backend (text/HTML/PNG/DIB/file-list/RTF), change watcher and pull-based format enumeration"
publish = false

[dependencies]
anyhow = "1"
blake3.workspace = true
dfy-proto = { path = "../dfy-proto" }
png = "0.18"
tracing = "0.1"

[dev-dependencies]
dfy-transport = { path = "../dfy-transport" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes", "allow-unsafe-code"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }