[package]
name = "dfy-capture"
version = "0.1.0"
edition = "2021"
description = "Windows DXGI Desktop Duplication screen capture for the Dafeiyu remote-desktop project"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
png = "0.18"