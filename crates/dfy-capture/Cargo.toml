[package]
name = "dfy-capture"
version = "0.1.0"
edition = "2021"
description = "Windows DXGI Desktop Duplication screen capture for the Dafeiyu remote-desktop project"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
anyhow = "1.0"

# Linux 采集后端：纯 Rust 的 X11 协议实现（x11rb 默认走自身协议栈，
# 不启用 `dl-libxcb`，因此不链接 libX11/libxcb，也就没有 C 依赖）。
# `randr` 用于显示器枚举，`xinerama` 用于 RandR 不可用时的兜底，
# `resource_manager` 保留给后续 X 资源数据库（DPI/光标主题）使用，
# `allow-unsafe-code` 是 x11rb 在 Linux 上建立 socket 连接所必需的。
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = [
    "randr",
    "xinerama",
    "resource_manager",
    "allow-unsafe-code",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
png = "0.18"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"